name: Build and release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        run: echo "version=0.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install --yes tmux
      - run: make test
      - run: make terminal-test
      - run: sh -n scripts/install.sh scripts/package.sh .github/scripts/check-install.sh

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      SHIMMER_VERSION: ${{ needs.version.outputs.version }}
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - run: cargo build --release --locked --target "${{ matrix.target }}"
      - run: sh scripts/package.sh "$SHIMMER_VERSION" "${{ matrix.target }}" "target/${{ matrix.target }}/release/shimmer"
      - run: sh .github/scripts/check-install.sh "$PWD/target/${{ matrix.target }}/release/shimmer" "$PWD/dist/shimmer-${{ matrix.target }}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: shimmer-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [version, check, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: shimmer-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: shimmer-*
          path: dist
          merge-multiple: true
      - name: Publish versioned bundles
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check ./*.sha256
          sha256sum ./*.tar.gz > SHA256SUMS
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" ./*.tar.gz ./*.sha256 SHA256SUMS --clobber
          else
            gh release create "$tag" ./*.tar.gz ./*.sha256 SHA256SUMS \
              --target "$GITHUB_SHA" --title "Shimmer $VERSION" --latest=false \
              --notes "Native Shimmer binaries for Linux and macOS. Extract the bundle for your platform, then run sh install.sh. Existing effect configuration is preserved."
          fi
          newest=$(gh api --paginate "repos/$GH_REPO/releases" --jq '.[].tag_name' \
            | sed -n 's/^v0\.1\.\([0-9][0-9]*\)$/\1/p' | sort -n | tail -n 1)
          if [[ $newest == "${VERSION##*.}" ]]; then
            gh release edit "$tag" --latest
          fi
